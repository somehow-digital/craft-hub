name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: ${{ matrix.php == '8.5' && 'xdebug' || 'none' }}

      - uses: ramsey/composer-install@4.0.0
        with:
          # composer.lock pins packages requiring PHP >= 8.4, so resolve fresh on 8.3
          dependency-versions: ${{ matrix.php == '8.3' && 'highest' || 'locked' }}

      - name: Run tests
        if: matrix.php != '8.5'
        run: composer test

      - name: Run tests with coverage
        if: matrix.php == '8.5'
        run: composer test-coverage
