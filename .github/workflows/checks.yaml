name: CHECK

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: composer manifest
            script: composer-normalize
          - name: coding standard
            script: ecs
          - name: template format
            script: twig
          - name: refactoring
            script: rector
          - name: static analysis
            script: phpstan
          - name: architecture
            script: deptrac
          - name: dependencies
            script: deps
          - name: code coverage
            script: coverage
            coverage: pcov
          - name: mutation testing
            script: mutate
            # Mutation testing runs the tests against the mutants that they cover. Pull requests only mutate the classes they
            # change, as the whole plugin takes too long; the whole plugin is mutated on main.
            coverage: pcov

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The base of a pull request, to tell the classes it changes in mutation testing.
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: ${{ matrix.coverage || 'none' }}

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run ${{ matrix.script }}
        if: ${{ !(matrix.script == 'mutate' && github.event_name == 'pull_request') }}
        run: composer ${{ matrix.script }}

      - name: Run ${{ matrix.script }} of the changed classes
        if: ${{ matrix.script == 'mutate' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/mutate-changed.sh "$BASE_REF"

